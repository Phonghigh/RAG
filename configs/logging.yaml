# Version 1 of the logging configuration
version: 1

# Formatters are used to define the format of the logs
formatters:
  # Standard formatter is used to format the logs in a standard format
  standard:
    # The format of the logs is defined here
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

# Handlers are used to define the output of the logs
handlers:
  # Console handler is used to output the logs to the console
  console:
    # The class of the handler is defined here
    class: logging.StreamHandler
    # The formatter of the handler is defined here
    formatter: standard

# Loggers are used to define the output of the logs
loggers:
  # Uvicorn error logger is used to output the logs to the console
  uvicorn.error:
    # The level of the logger is defined here
    level: INFO
    # The handlers of the logger are defined here
    handlers: [console]
    # The propagate of the logger is defined here
    propagate: false
  # App logger is used to output the logs to the console
  app:
    # The level of the logger is defined here
    level: INFO
    # The handlers of the logger are defined here
    handlers: [console]
    # The propagate of the logger is defined here
    propagate: false
  # Root logger is used to output the logs to the console
root:
    # The level of the logger is defined here
    level: INFO
    # The handlers of the logger are defined here
    handlers: [console]