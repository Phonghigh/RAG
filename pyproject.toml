[tool.poetry]
name = "rca-rag"
version = "0.1.0"
description = "RCA-RAG bootstrap (FastAPI + Google Chat webhook)"
authors = ["you <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
httpx = "^0.27.0"
python-dotenv = "^1.0.1"
pydantic = "^2.8.0"
pyyaml = "^6.0.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.5"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"